# InvestFlow CI (ITER-01 — deliverable 5: lint/type configs are CI-runnable, NFR-6)
#
# Jobs:
#   backend  — ruff + mypy strict + pytest (tests/api, tests/unit)
#   frontend — eslint flat + tsc --noEmit + vitest
#   e2e      — Playwright smoke against the stacked real stack (backend + frontend)
name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: backend — lint, typecheck, tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true
      - name: Sync deps
        run: uv sync
      - name: Ruff (format check + lint)
        run: uv run ruff format --check . && uv run ruff check .
      - name: mypy strict (NFR-6)
        run: uv run mypy app
      - name: pytest
        run: uv run pytest -q --cov=app --cov-report=term

  frontend:
    name: frontend — lint, typecheck, tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: "**/pnpm-lock.yaml"
      - name: Install deps
        run: pnpm install
      - name: ESLint (flat config)
        run: pnpm exec eslint .
      - name: TypeScript strict (NFR-6)
        run: pnpm exec tsc --noEmit
      - name: vitest
        run: pnpm exec vitest run

  e2e:
    name: e2e — Playwright smoke
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: "**/pnpm-lock.yaml"
      - name: Install backend deps
        run: |
          cd backend && uv sync
      - name: Install frontend deps
        run: |
          (cd frontend && pnpm install)
          pnpm install
      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium
      - name: Run smoke suite
        run: pnpm exec playwright test
        env:
          CI: "true"
